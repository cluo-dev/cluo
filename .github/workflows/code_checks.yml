name: Code Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-checks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install poetry
      run: |
        pip install poetry==1.8.3
    
    - name: Install dependencies
      run: |
        poetry install
    
    - name: Run ruff check
      run: |
        poetry run ruff check --fix
    
    - name: Run ruff format
      run: |
        poetry run ruff format
    
    - name: Run mypy
      run: |
        poetry run mypy cluo/ examples/
    
    - name: Run interrogate
      run: |
        poetry run interrogate -c pyproject.toml cluo/
    
    - name: Run xenon
      run: |
        poetry run xenon -b B -m A -a A cluo/
    
    - name: Validate examples
      run: |
        poetry run python tools/validate_examples.py